name: Enterprise CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: 7-Gateway Quality Engine & Build Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 7-Gateway Verification Engine
        run: npm run verify

      - name: Compile Production Bundle
        run: npm run build

      - name: Build Storybook Catalog
        run: npm run build-storybook
